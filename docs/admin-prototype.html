<!doctype html>
<html lang="ko" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ssg-agent 관리자 시안</title>
<style>
/* ── 테마 토큰: 테마를 추가하려면 이 묶음 하나만 더하면 됩니다 ── */
:root, [data-theme="midnight"] {
  --bg:#10151f; --panel:#141a26; --card:#1b2334; --card-2:#222c40; --line:#2c3750;
  --text:#e6ebf5; --sub:#8f9bb3; --accent:#5b9bff; --accent-bg:#1e2d4a;
  --ok:#7ee2a8; --ok-bg:#1d3a2b; --wait:#f5c26b; --wait-bg:#3d2f17; --bad:#ff8f8f; --bad-bg:#3a1c1f;
  --note-bg:#2a2114; --note-line:#e8a33d; --note-text:#f0dcc0;
  --radius:12px; --num-font:inherit; --density:1;
}
[data-theme="studio"] {
  --bg:#efeee9; --panel:#f7f6f2; --card:#ffffff; --card-2:#f3f2ed; --line:#e2e0d8;
  --text:#2c2c2a; --sub:#6f6e68; --accent:#534ab7; --accent-bg:#eeedfe;
  --ok:#0f6e56; --ok-bg:#e1f5ee; --wait:#854f0b; --wait-bg:#faeeda; --bad:#a32d2d; --bad-bg:#fcebeb;
  --note-bg:#fcebeb; --note-line:#e24b4a; --note-text:#791f1f;
  --radius:12px; --num-font:inherit; --density:1;
}
[data-theme="pro"] {
  --bg:#0a0a0b; --panel:#0e0e10; --card:#16161a; --card-2:#1d1d22; --line:#26262b;
  --text:#e8e8e8; --sub:#8a8a92; --accent:#a3e635; --accent-bg:#1f2a10;
  --ok:#a3e635; --ok-bg:#1f2a10; --wait:#f59e0b; --wait-bg:#2e2008; --bad:#fca5a5; --bad-bg:#2a1214;
  --note-bg:#1f1012; --note-line:#ef4444; --note-text:#fca5a5;
  --radius:6px; --num-font:ui-monospace,Consolas,monospace; --density:.8;
}

* { box-sizing:border-box; }

/* 스크롤 막대: 테마 색을 따라감 */
* { scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
*:hover { scrollbar-color:var(--sub) transparent; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--line); border-radius:10px; border:3px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-thumb:hover { background:var(--sub); border:3px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-corner { background:transparent; }

/* 화면 비율 아이콘 */
.aspects { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.aspect { display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 2px 6px; background:var(--card);
  border:1px solid var(--line); border-radius:8px; color:var(--sub); }
.aspect .frame { width:36px; height:36px; display:flex; align-items:center; justify-content:center; }
.aspect .ar { border:1.5px solid currentColor; border-radius:3px; }
.aspect b { font-size:12px; font-weight:600; font-family:var(--num-font); color:var(--text); }
.aspect small { font-size:10px; line-height:1.2; text-align:center; }
.aspect:hover { border-color:var(--accent); }
.aspect.on { border-color:var(--accent); background:var(--accent-bg); color:var(--accent); }
.aspect.on .ar { background:color-mix(in srgb, var(--accent) 25%, transparent); }
.aspect.on b { color:var(--accent); }
.role-help { margin-top:8px; padding:10px 12px; border-radius:8px; background:var(--card); border:1px solid var(--line); font-size:12px; color:var(--sub); }
.role-help b { color:var(--text); font-weight:600; }
.role-help ul { margin:6px 0 0; padding-left:16px; }
.empty { margin-top:18px; padding:32px; text-align:center; border:1px dashed var(--line); border-radius:var(--radius); color:var(--sub); }
.empty .btn { width:auto; display:inline-block; padding:8px 18px; margin-top:12px; }
body { margin:0; background:var(--bg); color:var(--text);
  font:14px/1.6 "Pretendard","Malgun Gothic",system-ui,sans-serif; }
button { font:inherit; color:inherit; cursor:pointer; }
.app { display:grid; height:100vh; grid-template-rows:52px 1fr;
  grid-template-columns:220px minmax(0,1fr) 300px;
  grid-template-areas:"top top top" "nav main side"; }
.app.side-closed { grid-template-columns:220px minmax(0,1fr) 0; }

/* 상단 바 */
.top { grid-area:top; display:flex; align-items:center; gap:12px; padding:0 16px;
  background:var(--panel); border-bottom:1px solid var(--line); }
.logo { font-weight:600; letter-spacing:.2px; }
.top select { background:var(--card); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:5px 8px; }
.spacer { flex:1; }
.themes { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.themes button { background:transparent; border:0; padding:5px 10px; color:var(--sub); font-size:12px; }
.themes button.on { background:var(--accent-bg); color:var(--accent); }
.icon-btn { background:transparent; border:1px solid var(--line); border-radius:8px; padding:4px 9px; color:var(--sub); }
.burger { display:none; }

/* 왼쪽 메뉴 */
.nav { grid-area:nav; background:var(--panel); border-right:1px solid var(--line); padding:12px 8px; overflow:auto; }
.nav button { display:flex; width:100%; align-items:center; gap:10px; background:transparent; border:0;
  padding:calc(9px * var(--density)) 12px; border-radius:8px; color:var(--sub); text-align:left; }
.nav button:hover { background:var(--card); color:var(--text); }
.nav button.on { background:var(--accent-bg); color:var(--accent); }
.nav .grp { font-size:11px; color:var(--sub); padding:12px 12px 4px; opacity:.8; }
.badge { margin-left:auto; font-size:11px; padding:0 7px; border-radius:10px; background:var(--wait-bg); color:var(--wait); }

/* 가운데 */
.main { grid-area:main; overflow:auto; padding:24px 28px; }
.main h1 { font-size:22px; margin:0 0 2px; font-weight:600; }
.meta { color:var(--sub); font-size:13px; font-family:var(--num-font); }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:18px 0; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
.stat b { display:block; font-size:22px; font-family:var(--num-font); font-weight:600; }
.stat span { color:var(--sub); font-size:12px; }
.progress { display:flex; gap:3px; margin:16px 0 8px; }
.progress i { flex:1; height:6px; border-radius:2px; background:var(--card-2); }
.progress i.done { background:var(--ok); } .progress i.wait { background:var(--wait); } .progress i.fail { background:var(--bad); }
.steps { display:flex; flex-direction:column; gap:8px; }
.step { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); padding:calc(11px * var(--density)) 14px; text-align:left; width:100%; }
.step:hover, .step.sel { border-color:var(--accent); }
.num { width:26px; height:26px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:12px; background:var(--accent-bg); color:var(--accent); font-family:var(--num-font); }
.pill { margin-left:auto; font-size:12px; padding:2px 10px; border-radius:6px; white-space:nowrap; }
.p-done { background:var(--ok-bg); color:var(--ok); } .p-wait { background:var(--wait-bg); color:var(--wait); }
.p-fail { background:var(--bad-bg); color:var(--bad); } .p-pend { background:var(--card-2); color:var(--sub); }
.note { margin:14px 0; padding:10px 14px; background:var(--note-bg); border-left:3px solid var(--note-line); color:var(--note-text); }
.h2 { font-size:15px; font-weight:600; margin:26px 0 10px; }
.gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; }
.scene { aspect-ratio:9/16; border-radius:var(--radius); border:1px solid var(--line); background:var(--card-2);
  display:flex; align-items:flex-end; padding:6px; font-size:12px; color:var(--sub); font-family:var(--num-font); }
.scene:hover, .scene.sel { border-color:var(--accent); color:var(--text); }
.scene.fail { border-color:var(--bad); color:var(--bad); }
table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
td, th { padding:10px 14px; border-bottom:1px solid var(--line); text-align:left; font-size:13px; }
th { color:var(--sub); font-weight:500; }
tr.click:hover { background:var(--card-2); cursor:pointer; }
.check { display:flex; gap:10px; align-items:center; }
.box { width:18px; height:18px; border-radius:5px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; }
.box.on { background:var(--ok-bg); color:var(--ok); border-color:var(--ok); }
.drop { border:2px dashed var(--line); border-radius:var(--radius); padding:40px; text-align:center; color:var(--sub); }

/* 오른쪽 세부 조절 */
.side { grid-area:side; background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:18px; }
.side-closed .side { display:none; }
.side h3 { margin:0 0 2px; font-size:15px; }
.side .meta { margin-bottom:14px; }
.field { margin:14px 0; }
.field label { display:block; font-size:12px; color:var(--sub); margin-bottom:5px; }
.field select, .field input { width:100%; background:var(--card); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:7px 9px; font:inherit; }
.seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button { flex:1; background:var(--card); border:0; border-right:1px solid var(--line); padding:6px 0; font-size:12px; color:var(--sub); }
.seg button:last-child { border-right:0; }
.seg button.on { background:var(--accent-bg); color:var(--accent); }
.btn { display:block; width:100%; margin-top:8px; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--card); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:600; }
.field textarea { width:100%; background:var(--card); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:7px 9px; font:inherit; resize:vertical; }
.field input[type=range] { padding:0; border:0; background:transparent; accent-color:var(--accent); }
.field input[type=checkbox] { width:auto; accent-color:var(--accent); }
.rv { float:right; color:var(--text); font-weight:500; font-family:var(--num-font); }
.chks { display:flex; flex-direction:column; gap:4px; }
.chk { display:flex !important; gap:8px; align-items:center; color:var(--text) !important; font-size:13px !important; margin:0 !important; }
.picks { display:flex; flex-direction:column; gap:6px; }
.pick { text-align:left; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; }
.pick.on { border-color:var(--accent); background:var(--accent-bg); color:var(--accent); }
.sec { font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.5px; margin:20px 0 -4px;
  padding-top:12px; border-top:1px solid var(--line); }
button.stat { text-align:left; color:inherit; }
button.stat:hover, button.stat.sel { border-color:var(--accent); }
button.stat.sel { background:var(--accent-bg); }
.items { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.item { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; text-align:left; }
.item:hover, .item.sel { border-color:var(--accent); }
.item .thumb { height:70px; border-radius:6px; background:var(--card-2); margin-bottom:8px; display:flex;
  align-items:center; justify-content:center; color:var(--sub); font-size:20px; }
.item.add { border:1.5px dashed var(--accent); background:var(--accent-bg); color:var(--accent); font-weight:600; }
.item.add .thumb { background:transparent; border:1.5px dashed var(--accent); color:var(--accent); font-size:28px; }
.item.add small { color:var(--accent); opacity:.75; font-weight:400; }
.item.add:hover { background:var(--accent); color:var(--bg); }
.item.add:hover .thumb, .item.add:hover small { color:var(--bg); border-color:var(--bg); }
.side { display:flex; flex-direction:column; }
.side-foot { margin-top:auto; padding-top:16px; position:sticky; bottom:-18px; background:var(--panel); padding-bottom:18px; }
.add-btn { border:1.5px dashed var(--accent); color:var(--accent); background:var(--accent-bg); font-weight:600; }
.item small { display:block; color:var(--sub); font-size:12px; font-family:var(--num-font); }
.log { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--sub); background:var(--card); border:1px solid var(--line);
  border-radius:8px; padding:10px; white-space:pre-wrap; }

/* 로그인 */
body.locked .app { display:none; }
body:not(.locked) .auth { display:none; }
body.not-admin .admin-only { display:none !important; }
.auth { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
.auth-card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px; }
.auth-card h2 { margin:0 0 4px; font-size:20px; }
.auth-card .logo { color:var(--accent); font-size:13px; display:block; margin-bottom:18px; }
.pw { display:flex; gap:6px; }
.pw input { flex:1; }
.pw button { flex:none; width:58px; background:var(--card); border:1px solid var(--line); border-radius:8px; font-size:12px; color:var(--sub); }
.auth-links { display:flex; justify-content:center; gap:14px; margin-top:16px; font-size:13px; }
.auth-links button, .linkbtn { background:none; border:0; color:var(--sub); text-decoration:underline; padding:0; }
.err { color:var(--bad); font-size:13px; min-height:20px; margin-top:8px; }
.ok-msg { color:var(--ok); font-size:13px; margin-top:8px; }
.hint { font-size:12px; color:var(--sub); margin-top:10px; }

/* 왼쪽 아래: 내 계정 · 설정 · 로그아웃 */
.nav { display:flex; flex-direction:column; }
.nav-foot { margin-top:auto; padding-top:10px; border-top:1px solid var(--line); }
.me-row { display:flex; gap:4px; align-items:center; }
.nav .me { flex:1; min-width:0; padding:6px 8px; }
.avatar { width:30px; height:30px; flex:none; border-radius:50%; background:var(--accent-bg); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:600; }
.me-txt { min-width:0; display:flex; flex-direction:column; line-height:1.3; }
.me-txt b { font-weight:500; color:var(--text); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.me-txt small { font-size:11px; }
.nav .gear { width:38px; flex:none; justify-content:center; font-size:18px; padding:6px 0; }
.nav .logout { margin-top:4px; font-size:13px; }

/* 사용자 관리 */
.toolbar { display:flex; gap:8px; align-items:center; margin:18px 0 10px; }
.toolbar .btn { width:auto; margin:0; padding:7px 14px; }
.tag { font-size:11px; padding:1px 8px; border-radius:6px; background:var(--card-2); color:var(--sub); margin-left:6px; }
.tog { display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid var(--line); }
.tog select { width:auto !important; padding:3px 6px !important; font-size:12px !important; }
.switch { position:relative; width:38px; height:22px; flex:none; }
.switch input { opacity:0; width:0; height:0; }
.switch span { position:absolute; inset:0; border-radius:11px; background:var(--card-2); border:1px solid var(--line); cursor:pointer; }
.switch span::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--sub); transition:.15s; }
.switch input:checked + span { background:var(--accent-bg); border-color:var(--accent); }
.switch input:checked + span::after { left:18px; background:var(--accent); }
.btn.danger { color:var(--bad); border-color:var(--bad); background:transparent; }

/* 폰 화면: 왼쪽 메뉴는 햄버거, 오른쪽 패널은 아래 시트 */
@media (max-width: 860px) {
  .app, .app.side-closed { grid-template-columns:minmax(0,1fr); grid-template-areas:"top" "main"; }
  .burger { display:inline-block; }
  .nav { position:fixed; top:52px; left:0; bottom:0; width:240px; z-index:5; transform:translateX(-100%); transition:transform .2s; }
  .nav.open { transform:none; }
  .side { position:fixed; left:0; right:0; bottom:0; max-height:60vh; z-index:4; border-left:0;
    border-top:1px solid var(--line); border-radius:16px 16px 0 0; }
  .main { padding:18px 16px 40vh; }
  .themes button { padding:5px 7px; }
  .top select { display:none; }
}
</style>
</head>
<body class="locked">
<div class="auth" id="auth"></div>
<div class="app" id="app">
  <header class="top">
    <button class="icon-btn burger" onclick="document.getElementById('nav').classList.toggle('open')" aria-label="메뉴">☰</button>
    <span class="logo">ssg-agent</span>
    <select aria-label="지금 보고 있는 채널" title="지금 보고 있는 채널 — 바꾸면 대시보드·프로젝트 목록이 이 채널 기준으로 바뀌어요"></select>
    <span class="spacer"></span>
    <div class="themes" id="themes">
      <button data-t="midnight">미드나잇</button>
      <button data-t="studio">스튜디오 라이트</button>
      <button data-t="pro">편집실 프로</button>
    </div>
    <button class="icon-btn" onclick="toggleSide()" aria-label="세부 패널 열고 닫기">▥</button>
  </header>

  <nav class="nav" id="nav">
    <div class="grp">제작</div>
    <button data-v="dashboard">대시보드</button>
    <button data-v="project">프로젝트 <span class="badge">1</span></button>
    <button data-v="upload">자료 올리기</button>
    <div class="grp">관리</div>
    <button data-v="library">라이브러리</button>
    <button data-v="providers">AI 연결</button>
    <button data-v="prompts">프롬프트</button>
    <button data-v="runs">실행 내역</button>
    <div class="grp">채널</div>
    <button data-v="youtube">유튜브 도우미</button>
    <button data-v="settings" class="admin-only">설정</button>
    <div class="nav-foot">
      <div class="me-row">
        <button class="me" onclick="myAccount()" title="내 계정"><span class="avatar" id="meAvatar"></span><span class="me-txt"><b id="meName"></b><small id="meRole"></small></span></button>
        <button class="gear admin-only" onclick="go('settings')" title="설정 관리" aria-label="설정 관리">⚙</button>
      </div>
      <button class="logout" onclick="logout()">로그아웃</button>
    </div>
  </nav>

  <main class="main" id="main"></main>
  <aside class="side" id="side"></aside>
</div>

<script>
const STEPS = [
  ["규격 정하기","done"],["핵심 지침","done"],["참고 영상 분석","done"],["캐릭터 준비","done"],
  ["대본과 장면 콘티","wait"],["음성","pend"],["자막 시간","pend"],["장면 이미지·클립","fail"],
  ["음악·효과음","pend"],["타임라인","pend"],["렌더링","pend"],["검수","pend"]];
const PILL = {done:["p-done","완료"], wait:["p-wait","승인 대기"], fail:["p-fail","실패"], pend:["p-pend","대기"]};
const $main = document.getElementById("main"), $side = document.getElementById("side");

const VIEWS = {
  dashboard: () => { const ps = chProjects(), all = CUR === "all";
    return `
    <h1>대시보드</h1><div class="meta">${esc(chName())} · 2026-11-19</div>
    <div class="cards">
      <div class="stat"><b>${ps.filter(p => p[3] !== "done").length}</b><span>진행 중</span></div>
      <div class="stat"><b>${ps.filter(p => p[3] === "wait").length}</b><span>승인 대기</span></div>
      <div class="stat"><b>${ps.filter(p => p[3] === "fail").length}</b><span>실패</span></div>
      <div class="stat"><b>₩${(ps.length * 620).toLocaleString()}</b><span>오늘 비용 / ₩7,000</span></div>
    </div>
    <div class="h2">프로젝트</div>
    ${ps.length ? `<table><tr><th>번호</th>${all ? "<th>채널</th>" : ""}<th>제목</th><th>상태</th></tr>
      ${ps.map(p => `<tr class="click" onclick="openProject('${p[0]}')"><td class="meta">${p[0].toUpperCase()}</td>
        ${all ? `<td class="meta">${esc(chName(p[2]))}</td>` : ""}<td>${esc(p[1])}</td><td><span class="pill ${PILL[p[3]][0]}">${PILL[p[3]][1]}</span></td></tr>`).join("")}
    </table>` : emptyChannel()}`; },

function setAspect(r, b) {

async function hashPw(id, pw) {
  const text = "ssg:" + id.toLowerCase() + ":" + pw;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return "sha256:" + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  return "mock:" + btoa(unescape(encodeURIComponent(text)));   // 시안 전용
}

async function doSetup() {
  const id = val("aId"), pw = document.getElementById("aPw").value, pw2 = document.getElementById("aPw2").value;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(id)) return msg("이메일 형식으로 입력하세요.");
  if (pwRule(pw)) return msg(pwRule(pw));
  if (pw !== pw2) return msg("비밀번호 확인이 달라요.");
  if (findUser(id)) return msg("이미 있는 아이디예요.");
  USERS.unshift({ id, name: id.split("@")[0], pw: await hashPw(id, pw), role: "admin", status: "active",
             channels: Object.fromEntries(CHANNELS.map(c => [c[0], true])), projects: {}, resetRequested: false, lastLogin: "" });
  saveUsers(); showAuth("login"); document.getElementById("aId").value = id; msg("관리자 계정을 만들었어요. 로그인하세요.", true);
}
async function doLogin() {

  if (!u || u.pw !== await hashPw(u.id, pw)) return msg("아이디 또는 비밀번호가 맞지 않아요.");
  if (u.status === "suspended") return msg("정지된 계정이에요. 관리자에게 문의하세요.");
  store.set("ssg-saved-id", document.getElementById("aSave").checked ? u.id : "");
  u.lastLogin = new Date().toLocaleString("ko-KR"); saveUsers();
  try { sessionStorage.setItem("ssg-session", u.id); } catch (e) {}
  ME = u; enterApp();
}

async function doChange() {
  const u = findUser(val("aId")), cur = document.getElementById("aCur").value;

  if (pwRule(pw)) return msg(pwRule(pw));
  if (pw !== pw2) return msg("새 비밀번호 확인이 달라요.");
  u.pw = await hashPw(u.id, pw); u.resetRequested = false; u.mustChange = false; saveUsers();
  msg("비밀번호를 바꿨어요.", true);
}
function logout() {
  try { sessionStorage.removeItem("ssg-session"); } catch (e) {}
  ME = null; showAuth("login");
}
function enterApp() {
  document.body.classList.remove("locked");
  document.body.classList.toggle("not-admin", ME.role !== "admin");
  document.getElementById("meAvatar").textContent = (ME.name || ME.id)[0].toUpperCase();
  document.getElementById("meName").textContent = ME.name || ME.id;
  document.getElementById("meRole").textContent = ROLES[ME.role];
  const sel = document.querySelector(".top select");   // 권한 있는 채널만 보이기
  const mine = myChannels();
  sel.innerHTML = mine.map(c => `<option value="${c[0]}">${c[1]}</option>`).join("") + (mine.length > 1 ? `<option value="all">전체 채널</option>` : "");
  sel.onchange = () => setChannel(sel.value);
  CUR = mine.length ? mine[0][0] : "all"; CURP = (chProjects()[0] || [null])[0];
  sel.value = CUR;
  go(ME.mustChange ? "dashboard" : "project");
  if (ME.mustChange) myAccount("임시 비밀번호로 로그인했어요. 새 비밀번호로 바꿔 주세요.");
}
function myAccount(notice = "") {
  openSide();
  $side.innerHTML = `<h3>내 계정</h3><div class="meta">${esc(ME.id)} · ${ROLES[ME.role]}</div>
    ${notice ? `<div class="note" style="margin:8px 0">${notice}</div>` : ""}
    ${F.info("접근 가능한 채널", CHANNELS.filter(c => ME.role === "admin" || ME.channels[c[0]]).map(c => c[1]).join("<br>") || "없음")}
    <button class="btn primary" onclick="showAuth('change')">비밀번호 변경</button>
    <button class="btn" onclick="logout()">로그아웃</button>`;
}

/* 설정 관리 (전체 관리자만) */
VIEWS.settings = () => `<h1>설정 관리</h1><div class="meta">사용자 · 접근 권한 · 작업공간</div>
  <div class="toolbar"><div class="h2" style="margin:0">사용자 ${USERS.length}명</div><span class="spacer"></span>
    <button class="btn primary" onclick="newUser()">＋ 사용자 등록</button></div>
  <table><tr><th>이름</th><th>아이디</th><th>역할</th><th>접근 채널</th><th>상태</th></tr>
  ${USERS.map((u,i) => `<tr class="click" onclick="editUser(${i}, this)"><td>${esc(u.name)}${u.id === ME.id ? '<span class="tag">나</span>' : ''}${u.temp ? '<span class="tag">임시</span>' : ''}${u.resetRequested ? '<span class="tag" style="color:var(--wait)">재설정 요청</span>' : ''}</td>
    <td class="meta">${esc(u.id)}</td><td>${ROLES[u.role]}</td>
    <td>${u.role === "admin" ? "전체" : CHANNELS.filter(c => u.channels[c[0]]).length + " / " + CHANNELS.length}</td>
    <td><span class="pill ${u.status === "active" ? "p-done" : "p-fail"}">${u.status === "active" ? "활성" : "정지"}</span></td></tr>`).join("")}</table>
  <div class="h2">역할 안내</div>
  <table>${Object.entries(ROLES).map(([k,n]) => `<tr><td style="width:120px">${n}</td><td class="meta">${ROLE_HELP[k]}</td></tr>`).join("")}</table>`;

const chanToggles = u => CHANNELS.map(c => `<div class="tog">${c[1]}<label class="switch"><input type="checkbox" data-ch="${c[0]}"${u.channels[c[0]] ? " checked" : ""}><span></span></label></div>`).join("");
const projOverrides = u => PROJECTS.map(p => `<div class="tog">${p[0].toUpperCase()} ${p[1]}<select data-pj="${p[0]}">
  ${[["","채널 설정 따름"],["on","허용"],["off","차단"]].map(([v,n]) => `<option value="${v}"${(u.projects[p[0]] || "") === v ? " selected" : ""}>${n}</option>`).join("")}</select></div>`).join("");
const userFoot = `<div class="side-foot"><button class="btn add-btn" onclick="newUser()">＋ 사용자 등록</button></div>`;

function editUser(i, el) {
  if (el) mark(el, "tr.click"); else openSide();
  const u = USERS[i], self = u.id === ME.id;
  $side.innerHTML = `<h3>${esc(u.name)}</h3><div class="meta">${esc(u.id)}${u.lastLogin ? " · 마지막 로그인 " + esc(u.lastLogin) : ""}</div>
    ${u.resetRequested ? '<div class="note" style="margin:8px 0">비밀번호 재설정을 요청했어요.</div>' : ""}
    <div class="field"><label>이름</label><input id="uName" value="${esc(u.name)}"></div>
    <div class="field"><label>역할</label><select id="uRole" onchange="showRoleHelp(this)"${self ? " disabled" : ""}>${Object.entries(ROLES).map(([k,n]) => `<option value="${k}"${u.role === k ? " selected" : ""}>${n}</option>`).join("")}</select>${roleHelp(u.role)}</div>
    <div class="field"><label>상태</label><div class="seg" id="uStatus">${[["active","활성"],["suspended","정지"]].map(([k,n]) =>
      `<button class="${u.status === k ? "on" : ""}" data-s="${k}" onclick="seg(this)"${self ? " disabled" : ""}>${n}</button>`).join("")}</div></div>
    <div class="sec">접근 권한 · 채널</div><div class="field">${u.role === "admin" ? '<div class="meta">전체 관리자는 모든 채널에 접근해요.</div>' : chanToggles(u)}</div>
    <div class="sec">프로젝트별 예외</div><div class="field">${u.role === "admin" ? '<div class="meta">해당 없음</div>' : projOverrides(u)}</div>
    <button class="btn primary" onclick="saveUser(${i})">저장</button>
    <button class="btn" onclick="resetPw(${i})">임시 비밀번호 발급</button>
    ${self ? "" : `<button class="btn danger" onclick="deleteUser(${i})">삭제</button>`}
    <div id="uMsg" class="ok-msg"></div>${userFoot}`;
}
function readPerms(u) {
  document.querySelectorAll("#side [data-ch]").forEach(x => u.channels[x.dataset.ch] = x.checked);
  document.querySelectorAll("#side [data-pj]").forEach(x => { if (x.value) u.projects[x.dataset.pj] = x.value; else delete u.projects[x.dataset.pj]; });
}
function saveUser(i) {
  const u = USERS[i], role = document.getElementById("uRole").value;
  if (u.role === "admin" && role !== "admin" && USERS.filter(x => x.role === "admin").length === 1)
    return document.getElementById("uMsg").textContent = "마지막 전체 관리자는 역할을 바꿀 수 없어요.";
  u.name = val("uName") || u.name; u.role = role;
  u.status = document.querySelector("#uStatus .on").dataset.s;
  readPerms(u); saveUsers(); go("settings"); editUser(i);
  document.getElementById("uMsg").textContent = "저장했어요.";
}
async function resetPw(i) {
  const u = USERS[i], temp = "tmp-" + Math.random().toString(36).slice(2, 8);
  u.pw = await hashPw(u.id, temp); u.mustChange = true; u.resetRequested = false; saveUsers(); go("settings"); editUser(i);
  document.getElementById("uMsg").innerHTML = `임시 비밀번호: <b>${temp}</b><br>지금 한 번만 보여요. 첫 로그인 때 바꾸게 안내돼요.`;
}
function deleteUser(i) {
  if (!confirm(`${USERS[i].name} 계정을 삭제할까요? 되돌릴 수 없어요.`)) return;
  USERS.splice(i, 1); saveUsers(); go("settings");
}
function newUser() {
  openSide();
  document.querySelectorAll("tr.click").forEach(e => e.classList.remove("sel"));
  const blank = { channels: {}, projects: {} };
  $side.innerHTML = `<h3>사용자 등록</h3><div class="meta">임시 비밀번호로 만들고, 첫 로그인 때 바꾸게 해요</div>
    <div class="field"><label>이름</label><input id="nName"></div>
    <div class="field"><label>아이디 (이메일)</label><input id="nId" autocomplete="off"></div>
    ${pwField("nPw","임시 비밀번호","8자 이상")}
    <div class="field"><label>역할</label><select id="nRole" onchange="showRoleHelp(this)">${Object.entries(ROLES).map(([k,n]) => `<option value="${k}"${k === "editor" ? " selected" : ""}>${n}</option>`).join("")}</select>${roleHelp("editor")}</div>
    <div class="sec">접근 권한 · 채널</div><div class="field">${chanToggles(blank)}</div>
    <button class="btn primary" onclick="createUser()">등록</button><div id="uMsg" class="err"></div>`;
}
async function createUser() {
  const id = val("nId"), pw = document.getElementById("nPw").value, $m = document.getElementById("uMsg");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(id)) return $m.textContent = "아이디는 이메일 형식으로 입력하세요.";
  if (findUser(id)) return $m.textContent = "이미 있는 아이디예요.";
  if (pwRule(pw)) return $m.textContent = pwRule(pw);
  const u = { id, name: val("nName") || id.split("@")[0], pw: await hashPw(id, pw), role: document.getElementById("nRole").value,
              status: "active", channels: {}, projects: {}, resetRequested: false, mustChange: true, lastLogin: "" };
  readPerms(u); USERS.push(u); saveUsers(); go("settings"); editUser(USERS.length - 1);
  document.getElementById("uMsg").textContent = "등록했어요.";
}

function go(v) {
  if (v === "settings" && ME?.role !== "admin") v = "dashboard";   // 일반 사용자는 설정 관리에 못 들어감
  CUR_VIEW = v;
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $main.innerHTML = (VIEWS[v] || (() => placeholder(NAMES[v] || v)))();
  $side.innerHTML = v === "project" || v === "dashboard" ? sideProject()
    : v === "settings" ? `<h3>설정 관리</h3><div class="meta">사용자를 누르면 여기서 고칠 수 있어요.</div>${userFoot}`
    : `<h3>세부 조절</h3><div class="meta">가운데에서 항목을 고르면 여기에 설정이 나와요.</div>`;
  if (v === "library") pickLib("character");
  document.getElementById("nav").classList.remove("open");
}
document.querySelectorAll(".nav button[data-v]").forEach(b => b.onclick = () => go(b.dataset.v));

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll("#themes button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  try { localStorage.setItem("ssg-theme", t); } catch (e) {}
}
document.querySelectorAll("#themes button").forEach(b => b.onclick = () => setTheme(b.dataset.t));
let saved = "midnight"; try { saved = localStorage.getItem("ssg-theme") || saved; } catch (e) {}
setTheme(saved);
if (window.matchMedia("(max-width: 860px)").matches) document.getElementById("app").classList.add("side-closed");
let sid = null; try { sid = sessionStorage.getItem("ssg-session"); } catch (e) {}
seedTempUsers().then(() => {
  ME = sid ? findUser(sid) : null;
  if (ME && ME.status === "active") enterApp(); else { ME = null; showAuth(); }
});
</script>
</body>
</html>
